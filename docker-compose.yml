services:
  postgres:
    image: postgres:16-alpine
    container_name: colombian_fruits_db
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-colombian_fruits}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-colombian_fruits}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: colombian_fruits_api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      NODE_ENV: production
      PORT: 3000
      DATABASE_SYNCHRONIZE: 'false'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
